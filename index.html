<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Movie Roulette</title>
  <meta name="description" content="Una ruleta interactiva para elegir qué película mirar.">
  <meta name="theme-color" content="#0c0709">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23a5162d' stroke='%23d9a441' stroke-width='2'/%3E%3Cg fill='%23f3e9d6'%3E%3Ccircle cx='16' cy='8' r='3'/%3E%3Ccircle cx='16' cy='24' r='3'/%3E%3Ccircle cx='8' cy='16' r='3'/%3E%3Ccircle cx='24' cy='16' r='3'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23d9a441'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/movies.js"></script>
  <script defer src="js/tmdb.js"></script>
  <script defer src="js/wheel.js"></script>
  <script defer src="js/autocomplete.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <main class="layout">
    <header class="brand">
      <h1 class="brand__title"><span>Movie</span> <span>Roulette</span></h1>
      <p class="brand__tagline">¿Qué vemos esta noche?</p>
    </header>

    <section class="stage" aria-label="Ruleta de películas">
      <div class="wheel" id="wheel">
        <svg class="wheel__rotor" id="wheelRotor" viewBox="0 0 1000 1000" role="img" aria-label="Ruleta vacía"></svg>
        <svg class="wheel__frame" id="wheelFrame" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
        <button class="wheel__spin" id="spinButton" type="button" disabled>Girar</button>
      </div>
    </section>

    <section class="add" aria-label="Agregar películas">
      <form id="addForm" novalidate>
        <fieldset class="lockable add__fields" id="addFields">
          <label class="add__label" for="movieInput">Agregar película</label>
          <div class="add__row">
            <input class="add__input" id="movieInput" type="text" maxlength="100"
                   placeholder="Nombre de la película" autocomplete="off"
                   aria-describedby="formMessage">
            <button class="button button--primary" type="submit">Agregar</button>
          </div>
          <p class="add__message" id="formMessage" role="alert"></p>
          <div class="suggestions" id="suggestions" hidden>
            <ul class="suggestions__list" id="suggestionList" role="listbox" aria-label="Sugerencias de películas"></ul>
            <p class="suggestions__status" id="suggestionStatus" role="status"></p>
          </div>
          <p class="add__credit" id="tmdbCredit" hidden>
            Búsqueda e imágenes de <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
            Esta app usa la API de TMDB pero no está avalada ni certificada por TMDB.
          </p>
        </fieldset>
      </form>
    </section>

    <section class="billboard" aria-labelledby="billboardTitle">
      <fieldset class="lockable billboard__body" id="listFields">
        <div class="billboard__header">
          <h2 class="billboard__title" id="billboardTitle">Cartelera</h2>
          <span class="billboard__count" id="movieCount">0 películas</span>
        </div>
        <p class="billboard__empty" id="emptyMessage">Todavía no hay películas. Agregá la primera para armar la ruleta.</p>
        <ul class="billboard__list" id="movieList"></ul>
        <button class="button button--ghost billboard__clear" id="clearButton" type="button" hidden>Vaciar lista</button>
      </fieldset>
    </section>
  </main>

  <dialog class="modal" id="resultDialog" aria-labelledby="resultTitle">
    <div class="ticket">
      <button class="ticket__close" id="resultClose" type="button" aria-label="Cerrar">&times;</button>
      <div class="ticket__main" id="resultMain">
        <img class="ticket__poster" id="resultPoster" alt="" hidden>
        <div class="ticket__info">
          <p class="ticket__eyebrow">Esta noche vemos</p>
          <h2 class="ticket__title" id="resultTitle"></h2>
          <p class="ticket__year" id="resultYear" hidden></p>
        </div>
      </div>
      <div class="ticket__actions">
        <button class="button button--primary" id="spinAgainButton" type="button">Volver a girar</button>
        <button class="button button--outline" id="removeWinnerButton" type="button">Quitar de la lista</button>
      </div>
    </div>
  </dialog>

  <dialog class="modal" id="clearDialog" aria-labelledby="clearTitle" aria-describedby="clearDescription">
    <div class="confirm">
      <h2 class="confirm__title" id="clearTitle">¿Vaciar la lista?</h2>
      <p class="confirm__text" id="clearDescription"></p>
      <div class="confirm__actions">
        <button class="button button--ghost" id="clearCancelButton" type="button">Cancelar</button>
        <button class="button button--primary" id="clearConfirmButton" type="button">Vaciar</button>
      </div>
    </div>
  </dialog>
</body>
</html>
